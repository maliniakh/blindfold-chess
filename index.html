<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindfold Chess Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inconsolata:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a120b;
    color: #f0e6d3;
    font-family: 'Inconsolata', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px;
    background-image: radial-gradient(ellipse at 20% 20%, #2d1a0e 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, #1a2d0e 0%, transparent 60%);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: #d4a843;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 12px rgba(212,168,67,0.3);
    text-align: center;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #a08060;
    margin-top: -20px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .size-picker {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .size-picker .label {
    font-size: 0.8rem;
    color: #a08060;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 6px;
  }
  .size-picker button { padding: 6px 10px; min-width: 52px; }
  .board-wrap {
    --board: min(440px, calc(100vw - 64px));
    display: grid;
    grid-template-columns: auto var(--board);
    grid-template-rows: var(--board) auto;
  }
  .coords-col {
    display: grid;
    padding-right: 8px;
    font-size: 0.75rem;
    color: #a08060;
    align-items: center;
  }
  .coords-row {
    grid-column: 2;
    display: grid;
    padding-top: 8px;
    font-size: 0.75rem;
    color: #a08060;
    text-align: center;
  }
  .board {
    display: grid;
    width: var(--board);
    height: var(--board);
    border: 2px solid #1a0a00;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  .square {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    user-select: none;
    min-width: 0;
    min-height: 0;
  }
  .square.light { background: #e8d5b0; }
  .square.dark  { background: #3d1f0a; }
  .square.selected { outline: 3px solid #d4a843; outline-offset: -3px; }
  .square.possible::after {
    content: '';
    position: absolute;
    width: 30%; height: 30%;
    border-radius: 50%;
    background: rgba(50,200,100,0.55);
    pointer-events: none;
    z-index: 1;
  }
  .square.possible.has-piece::after {
    width: auto; height: auto;
    inset: 4px;
    background: transparent;
    border-radius: 0;
    border: 4px solid rgba(220,60,60,0.7);
  }
  .piece {
    width: 85%;
    height: 85%;
    pointer-events: none;
    display: block;
  }
  .piece.hidden { visibility: hidden; }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: 'Inconsolata', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 22px;
    border: 1px solid #d4a843;
    background: transparent;
    color: #d4a843;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover, button.active { background: #d4a843; color: #1a120b; }
  .status {
    font-size: 0.9rem;
    color: #a08060;
    min-height: 1.5em;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .notation {
    font-size: 0.8rem;
    color: #705040;
    max-width: 440px;
    text-align: center;
    line-height: 1.6;
  }
  .notation span { color: #d4a843; }
</style>
</head>
<body>

<h1>Blindfold Trainer</h1>
<p class="subtitle" id="subtitle"></p>

<div class="size-picker" id="size-picker">
  <span class="label">Board size</span>
</div>

<div class="board-wrap">
  <div class="coords-col" id="rank-coords"></div>
  <div class="board" id="board"></div>
  <div class="coords-row" id="file-coords"></div>
</div>

<div class="controls">
  <button onclick="newPosition()">New position</button>
  <button id="btn-blindfold" onclick="toggleBlindFold()">Blindfold ▶</button>
  <button id="btn-moves" onclick="toggleMoves()">Show moves</button>
</div>

<div class="status" id="status"></div>
<div class="notation" id="notation-display"></div>

<script>
const MIN_SIZE = 2, MAX_SIZE = 8, DEFAULT_SIZE = 5;
const ALL_FILES = ['a','b','c','d','e','f','g','h'];
const HINT = 'Click a piece to see its moves.';

// Piece images by Cburnett (Wikimedia Commons, CC BY-SA 3.0), served from this repo
const PIECE_URLS = {};
['K','Q','R','B','N','P'].forEach(function(t) {
  PIECE_URLS['w'+t] = 'pieces/Chess_' + t.toLowerCase() + 'lt45.svg';
  PIECE_URLS['b'+t] = 'pieces/Chess_' + t.toLowerCase() + 'dt45.svg';
});
// Preload so pieces appear instantly on every render
Object.values(PIECE_URLS).forEach(function(u) { new Image().src = u; });

const PIECE_NAMES = { K:'King', Q:'Queen', R:'Rook', B:'Bishop', N:'Knight', P:'Pawn' };

let N = loadSize();
let FILES, RANKS;
let board = {};
let selected = null;
let showMoves = false;
let blindFoldOn = false;

function loadSize() {
  try {
    const s = parseInt(localStorage.getItem('blindfold-size'), 10);
    if (s >= MIN_SIZE && s <= MAX_SIZE) return s;
  } catch (e) {}
  return DEFAULT_SIZE;
}

function saveSize() {
  try { localStorage.setItem('blindfold-size', String(N)); } catch (e) {}
}

function rand(n) { return Math.floor(Math.random()*n); }

function generatePosition() {
  function adj(c1,r1,c2,r2) { return Math.abs(c1-c2)<=1 && Math.abs(r1-r2)<=1; }
  const used = new Set();
  const result = [];

  const wKc = rand(N), wKr = rand(N);
  used.add(wKc+','+wKr);
  result.push([wKc,wKr,'K','w']);

  // Black king must not touch the white one; impossible on 2×2, so it's skipped there
  const bKingSquares = [];
  for (let c=0; c<N; c++) for (let r=0; r<N; r++)
    if (!adj(c,r,wKc,wKr)) bKingSquares.push([c,r]);
  if (bKingSquares.length) {
    const sq = bKingSquares[rand(bKingSquares.length)];
    used.add(sq[0]+','+sq[1]);
    result.push([sq[0],sq[1],'K','b']);
  }

  const pool = [];
  ['w','b'].forEach(function(color) {
    ['Q','R','B','N'].forEach(function(t) { pool.push({type:t, color:color}); });
    for (let i=0; i<Math.max(2, N-3); i++) pool.push({type:'P', color:color});
  });
  const free = N*N - used.size;
  const maxExtra = Math.max(1, Math.min(pool.length, free - 1, Math.floor(N*N/4)));
  const minExtra = Math.max(1, Math.floor(maxExtra/2));
  const count = minExtra + rand(maxExtra - minExtra + 1);
  const extra = pool.sort(function(){ return Math.random()-0.5; }).slice(0, count);

  for (const p of extra) {
    // Pawns never stand on the first or last rank
    const options = [];
    for (let c=0; c<N; c++) for (let r=0; r<N; r++) {
      if (used.has(c+','+r)) continue;
      if (p.type==='P' && (r===0 || r===N-1)) continue;
      options.push([c,r]);
    }
    if (!options.length) continue;
    const sq = options[rand(options.length)];
    used.add(sq[0]+','+sq[1]);
    result.push([sq[0],sq[1],p.type,p.color]);
  }
  return result;
}

function initSizePicker() {
  const el = document.getElementById('size-picker');
  for (let s=MIN_SIZE; s<=MAX_SIZE; s++) {
    const b = document.createElement('button');
    b.textContent = s+'×'+s;
    b.dataset.size = s;
    b.addEventListener('click', function() { setSize(s); });
    el.appendChild(b);
  }
}

function setSize(s) {
  N = s;
  saveSize();
  applySize();
  newPosition();
}

function applySize() {
  FILES = ALL_FILES.slice(0, N);
  RANKS = [];
  for (let r=N; r>=1; r--) RANKS.push(String(r));
  document.title = 'Blindfold Chess ' + N + '×' + N;
  document.getElementById('subtitle').textContent = N + ' × ' + N + ' — practice board';
  document.querySelectorAll('#size-picker button').forEach(function(b) {
    b.classList.toggle('active', +b.dataset.size === N);
  });
  const tpl = 'repeat(' + N + ', 1fr)';
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = tpl;
  boardEl.style.gridTemplateRows = tpl;
  const ranksEl = document.getElementById('rank-coords');
  ranksEl.style.gridTemplateRows = tpl;
  ranksEl.innerHTML = RANKS.map(function(r){ return '<div>'+r+'</div>'; }).join('');
  const filesEl = document.getElementById('file-coords');
  filesEl.style.gridTemplateColumns = tpl;
  filesEl.innerHTML = FILES.map(function(f){ return '<div>'+f+'</div>'; }).join('');
}

function newPosition() {
  board = {};
  generatePosition().forEach(function(arr) { board[arr[0]+','+arr[1]] = {type:arr[2], color:arr[3]}; });
  selected = null;
  blindFoldOn = false;
  document.getElementById('btn-blindfold').classList.remove('active');
  document.getElementById('btn-blindfold').textContent = 'Blindfold ▶';
  document.getElementById('notation-display').innerHTML = '';
  document.getElementById('status').textContent = HINT;
  renderBoard();
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r=0; r<N; r++) {
    for (let c=0; c<N; c++) {
      const sq = document.createElement('div');
      // a1 is always a dark square
      sq.className = 'square ' + ((c + (N-1-r)) % 2 === 1 ? 'light' : 'dark');
      sq.dataset.c = c; sq.dataset.r = r;
      const key = c+','+r;
      if (board[key]) {
        const p = board[key];
        const img = document.createElement('img');
        img.className = 'piece' + (blindFoldOn ? ' hidden' : '');
        img.src = PIECE_URLS[p.color + p.type];
        img.alt = (p.color==='w' ? 'White ' : 'Black ') + PIECE_NAMES[p.type];
        sq.appendChild(img);
        sq.classList.add('has-piece');
      }
      if (selected && selected.c===c && selected.r===r) sq.classList.add('selected');
      sq.addEventListener('click', function() { handleClick(c, r); });
      el.appendChild(sq);
    }
  }
  if (showMoves && selected) highlightMoves();
}

function handleClick(c, r) {
  if (blindFoldOn) return;
  const key = c+','+r;
  if (board[key] && !(selected && selected.c===c && selected.r===r)) {
    selected = {c:c, r:r};
  } else {
    selected = null;
  }
  renderBoard();
  updateNotation();
}

function getMoves(c, r) {
  const p = board[c+','+r];
  if (!p) return [];
  const moves = [];
  const t = p.type;
  function inside(nc, nr) { return nc>=0 && nc<N && nr>=0 && nr<N; }
  function add(nc, nr) {
    if (!inside(nc, nr)) return false;
    const k = nc+','+nr;
    if (board[k] && board[k].color===p.color) return false;
    moves.push({c:nc, r:nr, capture:!!board[k]});
    return !board[k];
  }
  if (t==='N') {
    [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]].forEach(function(d){ add(c+d[0],r+d[1]); });
  } else if (t==='K') {
    for (let dc=-1;dc<=1;dc++) for (let dr=-1;dr<=1;dr++) if (dc||dr) add(c+dc,r+dr);
  } else if (t==='P') {
    const dir = p.color==='w' ? -1 : 1;
    if (inside(c, r+dir) && !board[c+','+(r+dir)]) moves.push({c:c,r:r+dir,capture:false});
    [-1,1].forEach(function(dc){
      const k=(c+dc)+','+(r+dir);
      if (board[k]&&board[k].color!==p.color) moves.push({c:c+dc,r:r+dir,capture:true});
    });
  } else {
    const dirs=[];
    if (t==='R'||t==='Q') dirs.push([1,0],[-1,0],[0,1],[0,-1]);
    if (t==='B'||t==='Q') dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
    dirs.forEach(function(d){
      let nc=c+d[0],nr=r+d[1];
      while(add(nc,nr)){nc+=d[0];nr+=d[1];}
    });
  }
  return moves;
}

function highlightMoves() {
  if (!selected) return;
  const moves = getMoves(selected.c, selected.r);
  document.querySelectorAll('.square').forEach(function(sq) {
    const mc = moves.find(function(m){ return m.c===+sq.dataset.c && m.r===+sq.dataset.r; });
    if (mc) { sq.classList.add('possible'); if (mc.capture) sq.classList.add('has-piece'); }
  });
}

// Algebraic notation, e.g. Nf3, Bxe5, exd5
function moveText(p, from, m) {
  const to = FILES[m.c]+RANKS[m.r];
  if (p.type==='P') return m.capture ? FILES[from.c]+'x'+to : to;
  return p.type + (m.capture ? 'x' : '') + to;
}

function updateNotation() {
  const el = document.getElementById('notation-display');
  if (!selected) { el.innerHTML=''; document.getElementById('status').textContent = HINT; return; }
  const p = board[selected.c+','+selected.r];
  if (!p) return;
  const sq = FILES[selected.c]+RANKS[selected.r];
  const moves = getMoves(selected.c, selected.r);
  const notations = moves.map(function(m){ return moveText(p, selected, m); }).join(', ');
  const name = (p.color==='w' ? 'White ' : 'Black ') + PIECE_NAMES[p.type].toLowerCase();
  el.innerHTML = 'Piece: <span>'+name+' on '+sq+'</span> &nbsp;|&nbsp; Moves: <span>'+(notations||'—')+'</span>';
  document.getElementById('status').textContent = '';
}

function toggleMoves() {
  showMoves = !showMoves;
  document.getElementById('btn-moves').classList.toggle('active', showMoves);
  renderBoard();
}

function toggleBlindFold() {
  blindFoldOn = !blindFoldOn;
  selected = null;
  document.getElementById('btn-blindfold').classList.toggle('active', blindFoldOn);
  document.getElementById('btn-blindfold').textContent = blindFoldOn ? 'Blindfold ■' : 'Blindfold ▶';
  document.getElementById('notation-display').innerHTML = '';
  document.getElementById('status').textContent = blindFoldOn
    ? 'Visualize the position from memory. Click again to check.'
    : HINT;
  renderBoard();
}

initSizePicker();
applySize();
newPosition();
</script>
</body>
</html>
