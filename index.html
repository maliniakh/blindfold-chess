<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindfold Chess 5×5</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inconsolata:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a120b;
    color: #f0e6d3;
    font-family: 'Inconsolata', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    background-image: radial-gradient(ellipse at 20% 20%, #2d1a0e 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, #1a2d0e 0%, transparent 60%);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: #d4a843;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 12px rgba(212,168,67,0.3);
  }
  .subtitle {
    font-size: 0.85rem;
    color: #a08060;
    margin-top: -20px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .board-wrap { display: flex; }
  .coords-col {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding: 4px 8px 4px 0;
    font-size: 0.75rem;
    color: #a08060;
  }
  .coords-row {
    display: flex;
    justify-content: space-around;
    padding: 8px 0 0 0;
    font-size: 0.75rem;
    color: #a08060;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 80px);
    grid-template-rows: repeat(5, 80px);
    border: 2px solid #1a0a00;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  .square {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    user-select: none;
  }
  .square.light { background: #e8d5b0; }
  .square.dark  { background: #3d1f0a; }
  .square.selected { outline: 3px solid #d4a843; outline-offset: -3px; }
  .square.possible::after {
    content: '';
    position: absolute;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(50,200,100,0.55);
    pointer-events: none;
    z-index: 1;
  }
  .square.possible.has-piece::after {
    width: 72px; height: 72px;
    background: transparent;
    border-radius: 0;
    border: 4px solid rgba(220,60,60,0.7);
  }
  .piece {
    width: 68px;
    height: 68px;
    pointer-events: none;
    display: block;
  }
  .piece.hidden { visibility: hidden; }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: 'Inconsolata', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 22px;
    border: 1px solid #d4a843;
    background: transparent;
    color: #d4a843;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover, button.active { background: #d4a843; color: #1a120b; }
  .status {
    font-size: 0.9rem;
    color: #a08060;
    min-height: 1.5em;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .notation {
    font-size: 0.8rem;
    color: #705040;
    max-width: 420px;
    text-align: center;
    line-height: 1.6;
  }
  .notation span { color: #d4a843; }
</style>
</head>
<body>

<h1>Blindfold Trainer</h1>
<p class="subtitle">5 × 5 — Szachownica ćwiczebna</p>

<div class="board-wrap">
  <div class="coords-col" id="rank-coords"></div>
  <div>
    <div class="board" id="board"></div>
    <div class="coords-row" id="file-coords"></div>
  </div>
</div>

<div class="controls">
  <button onclick="newPosition()">Nowa pozycja</button>
  <button id="btn-blindfold" onclick="toggleBlindFold()">Blindfold ▶</button>
  <button id="btn-moves" onclick="toggleMoves()">Pokaż ruchy</button>
</div>

<div class="status" id="status">Kliknij figurę, by zobaczyć jej ruchy.</div>
<div class="notation" id="notation-display"></div>

<script>
const FILES = ['a','b','c','d','e'];
const RANKS = ['5','4','3','2','1'];

// Wikimedia SVG chess pieces
const BASE = 'https://upload.wikimedia.org/wikipedia/commons/';
const PIECE_URLS = {
  wK: BASE + '4/42/Chess_klt45.svg',
  wQ: BASE + '1/15/Chess_qlt45.svg',
  wR: BASE + 'b/b1/Chess_rlt45.svg',
  wB: BASE + 'b/b1/Chess_blt45.svg',
  wN: BASE + '7/70/Chess_nlt45.svg',
  wP: BASE + '4/45/Chess_plt45.svg',
  bK: BASE + 'f/f0/Chess_kdt45.svg',
  bQ: BASE + '4/47/Chess_qdt45.svg',
  bR: BASE + 'f/ff/Chess_rdt45.svg',
  bB: BASE + '9/98/Chess_bdt45.svg',
  bN: BASE + 'e/ef/Chess_ndt45.svg',
  bP: BASE + 'c/c7/Chess_pdt45.svg',
};

// Notation symbols
const SYM = { K:'K', Q:'H', R:'W', B:'G', N:'S', P:'' };

let board = {};
let selected = null;
let showMoves = false;
let blindFoldOn = false;

function pieceKey(type, color) {
  return color + type.toUpperCase();
}

function generatePosition() {
  const pool = [
    {type:'Q',color:'w'},{type:'R',color:'w'},{type:'B',color:'w'},{type:'N',color:'w'},
    {type:'q',color:'b'},{type:'r',color:'b'},{type:'b',color:'b'},{type:'n',color:'b'},
    {type:'P',color:'w'},{type:'P',color:'w'},{type:'p',color:'b'},{type:'p',color:'b'},
  ];
  function adj(c1,r1,c2,r2) { return Math.abs(c1-c2)<=1 && Math.abs(r1-r2)<=1; }
  let wKc,wKr,bKc,bKr;
  do {
    wKc=Math.floor(Math.random()*5); wKr=Math.floor(Math.random()*5);
    bKc=Math.floor(Math.random()*5); bKr=Math.floor(Math.random()*5);
  } while (adj(wKc,wKr,bKc,bKr));
  const used = new Set([wKc+','+wKr, bKc+','+bKr]);
  const extra = [...pool].sort(()=>Math.random()-0.5).slice(0, 2+Math.floor(Math.random()*4));
  const result = [[wKc,wKr,'K','w'],[bKc,bKr,'k','b']];
  for (const p of extra) {
    let c,r,key,tries=0;
    do { c=Math.floor(Math.random()*5); r=Math.floor(Math.random()*5); key=c+','+r; tries++; }
    while (used.has(key) && tries<50);
    if (!used.has(key)) {
      const isPawn = p.type==='P'||p.type==='p';
      const badRank = isPawn && ((p.color==='w'&&r===0)||(p.color==='b'&&r===4));
      if (!badRank) { used.add(key); result.push([c,r,p.type,p.color]); }
    }
  }
  return result;
}

function initCoords() {
  document.getElementById('rank-coords').innerHTML =
    RANKS.map(r=>'<div style="height:80px;display:flex;align-items:center">'+r+'</div>').join('');
  document.getElementById('file-coords').innerHTML =
    FILES.map(f=>'<div style="width:80px;text-align:center">'+f+'</div>').join('');
}

function newPosition() {
  board = {};
  generatePosition().forEach(function(arr) { board[arr[0]+','+arr[1]] = {type:arr[2], color:arr[3]}; });
  selected = null;
  blindFoldOn = false;
  document.getElementById('btn-blindfold').classList.remove('active');
  document.getElementById('btn-blindfold').textContent = 'Blindfold ▶';
  document.getElementById('notation-display').innerHTML = '';
  document.getElementById('status').textContent = 'Kliknij figurę, by zobaczyć jej ruchy.';
  renderBoard();
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r=0; r<5; r++) {
    for (let c=0; c<5; c++) {
      const sq = document.createElement('div');
      sq.className = 'square ' + ((r+c)%2===0 ? 'light' : 'dark');
      sq.dataset.c = c; sq.dataset.r = r;
      const key = c+','+r;
      if (board[key]) {
        const p = board[key];
        const img = document.createElement('img');
        img.className = 'piece' + (blindFoldOn ? ' hidden' : '');
        img.src = PIECE_URLS[pieceKey(p.type, p.color)];
        img.alt = p.color + p.type;
        sq.appendChild(img);
        sq.classList.add('has-piece');
      }
      if (selected && selected.c===c && selected.r===r) sq.classList.add('selected');
      sq.addEventListener('click', function() { handleClick(c, r); });
      el.appendChild(sq);
    }
  }
  if (showMoves && selected) highlightMoves();
}

function handleClick(c, r) {
  if (blindFoldOn) return;
  const key = c+','+r;
  if (board[key] && !(selected && selected.c===c && selected.r===r)) {
    selected = {c:c, r:r};
  } else {
    selected = null;
  }
  renderBoard();
  updateNotation();
}

function getMoves(c, r) {
  const p = board[c+','+r];
  if (!p) return [];
  const moves = [];
  const t = p.type.toUpperCase();
  function add(nc, nr) {
    if (nc<0||nc>4||nr<0||nr>4) return false;
    const k = nc+','+nr;
    if (board[k] && board[k].color===p.color) return false;
    moves.push({c:nc, r:nr, capture:!!board[k]});
    return !board[k];
  }
  if (t==='N') {
    [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]].forEach(function(d){ add(c+d[0],r+d[1]); });
  } else if (t==='K') {
    for (var dc=-1;dc<=1;dc++) for (var dr=-1;dr<=1;dr++) if (dc||dr) add(c+dc,r+dr);
  } else if (t==='P') {
    const dir = p.color==='w' ? -1 : 1;
    if (r+dir>=0&&r+dir<=4&&!board[c+','+(r+dir)]) moves.push({c:c,r:r+dir,capture:false});
    [-1,1].forEach(function(dc){
      const k=(c+dc)+','+(r+dir);
      if (board[k]&&board[k].color!==p.color) moves.push({c:c+dc,r:r+dir,capture:true});
    });
  } else {
    const dirs=[];
    if(['R','Q'].includes(t)) dirs.push([1,0],[-1,0],[0,1],[0,-1]);
    if(['B','Q'].includes(t)) dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
    dirs.forEach(function(d){
      let nc=c+d[0],nr=r+d[1];
      while(add(nc,nr)){nc+=d[0];nr+=d[1];}
    });
  }
  return moves;
}

function highlightMoves() {
  if (!selected) return;
  const moves = getMoves(selected.c, selected.r);
  document.querySelectorAll('.square').forEach(function(sq) {
    const mc = moves.find(function(m){ return m.c===+sq.dataset.c && m.r===+sq.dataset.r; });
    if (mc) { sq.classList.add('possible'); if (mc.capture) sq.classList.add('has-piece'); }
  });
}

function updateNotation() {
  const el = document.getElementById('notation-display');
  if (!selected) { el.innerHTML=''; return; }
  const p = board[selected.c+','+selected.r];
  if (!p) return;
  const sq = FILES[selected.c]+RANKS[selected.r];
  const moves = getMoves(selected.c, selected.r);
  const notations = moves.map(function(m){ return FILES[m.c]+RANKS[m.r]+(m.capture?'×':''); }).join(', ');
  el.innerHTML = 'Figura: <span>'+p.color.toUpperCase()+p.type.toUpperCase()+' '+sq+'</span> &nbsp;|&nbsp; Ruchy: <span>'+(notations||'—')+'</span>';
  document.getElementById('status').textContent = '';
}

function toggleMoves() {
  showMoves = !showMoves;
  document.getElementById('btn-moves').classList.toggle('active', showMoves);
  renderBoard();
}

function toggleBlindFold() {
  blindFoldOn = !blindFoldOn;
  selected = null;
  document.getElementById('btn-blindfold').classList.toggle('active', blindFoldOn);
  document.getElementById('btn-blindfold').textContent = blindFoldOn ? 'Blindfold ■' : 'Blindfold ▶';
  document.getElementById('status').textContent = blindFoldOn
    ? 'Wizualizuj pozycję z pamięci. Kliknij ponownie aby sprawdzić.'
    : 'Kliknij figurę, by zobaczyć jej ruchy.';
  renderBoard();
}

initCoords();
newPosition();
</script>
</body>
</html>
